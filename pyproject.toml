[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abacus"
version = "2.0.0"
description = "A tool for analyzing Short Tandem Repeats (STRs) from Long-Read Sequencing data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Opstrup Drue", email = "simondrue@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyfaidx>=0.9.2.2",
    "levenshtein>=0.27.5",
    "pysam>=0.24.1",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.29.1",
    "pyspoa>=0.3.2",
    "biopython>=1.88",
]

[project.scripts]
abacus = "abacus.main:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abacus = ["scripts/*.Rmd", "str_catalogs/*.json", "img/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
