{% set name = "abacus-str" %}
{% set version = "2.0.0" %}
{% set python_min = "3.11" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://github.com/MOMA-AUH/abacus/archive/refs/tags/v{{ version }}.tar.gz"
  sha256: "7ae1c0ac927e6de4afd873ad468624c304b082861ee5228dc27f5a7d6090c8d0"

build:
  number: 1
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  run_exports:
    - {{ pin_subpackage('abacus-str', max_pin="x") }}

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=68
  run:
    - python >={{ python_min }}
    - networkx >=3.6.1
    - numpy >=2.4.6
    - pandas >=3.1.1
    - pyfaidx >=0.9.2.2
    - levenshtein >=0.27.5
    - pysam >=0.24.1
    - rapidfuzz >=3.14.6
    - rich >=15.0.0
    - scipy >=1.17.1
    - typer >=0.29.1
    - pyspoa >=0.3.2
    - biopython >=1.88
    - minigraph >=0.21
    - r-base >=4.5.3
    - r-dplyr >=1.2.1
    - r-ggplot2 >=4.0.4
    - r-ggh4x >=0.3.1
    - r-readr >=2.2.0
    - r-stringr >=1.6.0
    - r-tibble >=3.3.1
    - r-tidyr >=1.3.2
    - r-rcolorbrewer >=1.1_3
    - r-knitr >=1.52
    - r-kableextra >=1.4.1
    - r-rmarkdown >=2.32
    - r-htmltools >=0.5.9
    - pandoc >=3.14

test:
  imports:
    - abacus
  commands:
    - abacus --help
    - python -c "import json, subprocess; json.loads(subprocess.check_output(['abacus','--show-catalog'])); print('ok')"
about:
  home: "https://github.com/MOMA-AUH/abacus"
  license: MIT
  license_file: LICENSE
  summary: "A tool for analyzing Short Tandem Repeats (STRs) from Long-Read Sequencing data"

extra:
  recipe-maintainers:
    - simondrue