name: CI

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: env.yml
          environment-name: abacus
          cache-environment: true

      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip check

      - name: Check package and release versions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib
          from importlib.metadata import version
          from packaging.version import Version

          project = tomllib.loads(Path('pyproject.toml').read_text())
          project_version = Version(project['project']['version'])
          recipe = re.search(r'{%\s*set version\s*=\s*"([^"]+)"\s*%}', Path('recipe/meta.yaml').read_text())
          assert recipe, 'Missing conda recipe version'
          for name, value in [('recipe/meta.yaml', recipe[1]), ('installed wheel', version('abacus'))]:
              assert Version(value) == project_version, f'{name}: {value} does not match project version {project_version}'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              tag_version = Version(os.environ['GITHUB_REF_NAME'].removeprefix('v'))
              assert tag_version == project_version, f'Tag {tag_version} does not match project version {project_version}'
          PY

      - name: Run tests
        run: python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  recipe:
    name: Build conda recipe
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: build
          create-args: conda-build
          condarc: |
            channels: [conda-forge, bioconda]
            channel_priority: strict

      # The recipe points at the release tarball; build from this checkout instead
      - name: Point recipe at local source
        run: |
          sed -i -e 's|^  url: .*|  path: ..|' -e '/^  sha256:/d' recipe/meta.yaml
          sed -n '/^source:/,/^$/p' recipe/meta.yaml

      # Builds the package and runs the recipe's test section (import + CLI smoke tests)
      - name: Build and test
        run: conda build recipe --output-folder "$RUNNER_TEMP/conda-artifacts"

      - uses: actions/upload-artifact@v7
        with:
          name: conda-package
          path: |
            ${{ runner.temp }}/conda-artifacts/noarch/*.conda
            ${{ runner.temp }}/conda-artifacts/noarch/*.tar.bz2
          if-no-files-found: error
